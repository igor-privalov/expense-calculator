spring:
  application:
    name: expensio
  data:
    mongodb:
      uri: mongodb://expensio_user:expensio_pass@localhost:27017/expensio-db

cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600 
spring:
  application:
    name: expensio
  data:
    mongodb:
      uri: mongodb://expensio_user:expensio_pass@localhost:27017/expensio-db
server:
  port: 9090
management:
  endpoints:
    web:
      exposure:
        include: health,info
cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600 